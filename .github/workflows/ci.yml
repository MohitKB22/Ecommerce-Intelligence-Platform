name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  quality:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Lint Python
        run: python -m ruff check backend/app ml scripts

      - name: Type check Python
        run: python -m mypy backend/app --ignore-missing-imports
        continue-on-error: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Lint TypeScript
        run: npm --prefix frontend run lint

      - name: Type check TypeScript
        run: npm --prefix frontend run typecheck

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run unit and integration tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
        run: python -m pytest backend/tests -v --cov=backend/app --cov=ml --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  frontend-tests:
    name: Frontend tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm --prefix frontend ci
      - name: Run tests
        run: npm --prefix frontend run test
      - name: Production build
        run: npm --prefix frontend run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3

  full-pipeline:
    name: Migrate, seed, train & validate
    runs-on: ubuntu-latest
    needs: [backend-tests]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eci
          POSTGRES_PASSWORD: eci_password
          POSTGRES_DB: ecommerce_intelligence
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U eci" --health-interval 10s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://eci:eci_password@localhost:5432/ecommerce_intelligence
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r backend/requirements-dev.txt

      - name: Apply migrations
        run: python -m alembic upgrade head

      - name: Seed synthetic data
        run: python scripts/seed_database.py --reset

      - name: Train every model
        run: python scripts/train_all.py

      - name: Validate the project
        run: python scripts/validate_project.py

      - name: Smoke-test the API against PostgreSQL
        run: python -m pytest backend/tests/e2e -v
