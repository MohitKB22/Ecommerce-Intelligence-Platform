# E-Commerce Intelligence - full production-style stack.
#   cp .env.example .env && docker compose up --build
#
# Frontend  http://localhost:3000
# Backend   http://localhost:8000        API docs: http://localhost:8000/docs
name: ecommerce-intelligence

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-production}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-eci}:${POSTGRES_PASSWORD:-eci_password}@postgres:5432/${POSTGRES_DB:-ecommerce_intelligence}
  REDIS_URL: redis://redis:6379/0
  VECTOR_DB_URL: ${VECTOR_DB_URL:-}
  SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
  MODEL_PATH: /app/ml/models
  DATA_PATH: /app/data
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_JSON: ${LOG_JSON:-true}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ecommerce-intelligence.local}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin-change-me}
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eci}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eci_password}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce_intelligence}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eci} -d ${POSTGRES_DB:-ecommerce_intelligence}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Vector database. The application uses an exact in-process numpy index unless
  # VECTOR_DB_URL is set, so this service is opt-in.
  vector-db:
    image: pgvector/pgvector:pg16
    profiles: ["vector"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eci}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eci_password}
      POSTGRES_DB: vectors
    volumes:
      - vector_data:/var/lib/postgresql/data
    ports:
      - "${VECTOR_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eci} -d vectors"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: run migrations, seed synthetic data, train every model.
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *backend-env
    volumes:
      - model_data:/app/ml/models
      - seed_data:/app/data
    depends_on:
      postgres: {condition: service_healthy}
    command: >
      sh -c "alembic upgrade head &&
             python scripts/seed_database.py &&
             python scripts/train_all.py --continue-on-error"
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment: *backend-env
    volumes:
      - model_data:/app/ml/models
      - seed_data:/app/data
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment: *backend-env
    volumes:
      - model_data:/app/ml/models
      - seed_data:/app/data
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    command: ["python", "-m", "app.workers.runner"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys; sys.exit(0)\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional single entrypoint on :8080 in front of both services.
  gateway:
    image: nginx:1.27-alpine
    profiles: ["gateway"]
    restart: unless-stopped
    volumes:
      - ./infrastructure/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    depends_on:
      backend: {condition: service_healthy}
      frontend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/api/v1/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  vector_data:
  model_data:
  seed_data:
