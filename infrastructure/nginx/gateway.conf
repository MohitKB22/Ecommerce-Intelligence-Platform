# Optional single-entrypoint reverse proxy placed in front of both services.
# Enable with: docker compose --profile gateway up

upstream eci_backend  { server backend:8000;  keepalive 16; }
upstream eci_frontend { server frontend:80;   keepalive 16; }

# Basic abuse protection at the edge
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

server {
    listen 80;
    server_name _;

    client_max_body_size 5m;

    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass         http://eci_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass       http://eci_backend;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass       http://eci_frontend;
        proxy_set_header Host $host;
    }
}
