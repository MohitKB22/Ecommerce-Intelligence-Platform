name: Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'   # weekly regression on Mondays

jobs:
  matrix-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r backend/requirements-dev.txt
      - name: Run the full suite
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
        run: python -m pytest backend/tests -v

  ml-regression:
    name: ML quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r backend/requirements-dev.txt

      - name: Seed and train
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
        run: |
          python scripts/seed_database.py --reset
          python scripts/train_all.py

      - name: Assert every model beats its baseline
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
        run: python -m pytest backend/tests/integration/test_ml_pipelines.py -v
