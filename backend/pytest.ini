[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers --tb=short
asyncio_default_fixture_loop_scope = function
markers =
    slow: tests that train models or process large datasets
    integration: tests that exercise several layers together
    e2e: end-to-end user journeys through the API
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
